name: Alertas políticas

on:
  schedule:
    - cron: "17 */6 * * *"      # respaldo: reinicia el ciclo si alguna vez se detiene
  workflow_dispatch:            # botón "Run workflow" para ejecutarlo a mano
    inputs:
      modo:
        description: "revisar | probar | chat-id"
        default: "revisar"

permissions:
  contents: write               # para guardar estado_alertas.json (noticias ya enviadas)
  actions: write                # para relanzarse solo al terminar cada ciclo

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser requests

      - name: Ejecutar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODO="${{ github.event.inputs.modo || 'revisar' }}"
          if [ "$MODO" = "probar" ]; then python alertas_politicas.py --probar; exit 0; fi
          if [ "$MODO" = "chat-id" ]; then python alertas_politicas.py --chat-id; exit 0; fi

          git config user.name "alertas-bot"
          git config user.email "alertas-bot@users.noreply.github.com"
          FIN=$(( $(date +%s) + 5*3600 + 40*60 ))   # ciclo de 5 h 40 min
          while [ "$(date +%s)" -lt "$FIN" ]; do
            python alertas_politicas.py || echo "Error en la revisión; se reintenta en 3 minutos"
            git add estado_alertas.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "estado" -q
              git pull --rebase -q || true
              git push -q || true
            fi
            sleep 180
          done

      - name: Relanzar el ciclo
        if: ${{ always() && (github.event.inputs.modo || 'revisar') == 'revisar' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run alertas.yml --ref main -f modo=revisar
